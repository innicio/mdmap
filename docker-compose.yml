
services:
  mdmap:
    build: .
    container_name: mdmap
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "9000"
    volumes:
      - ./content:/app/content
      - ./images:/app/images
      - ./data:/app/data
      - ./public:/app/public
      - ./server.js:/app/server.js
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - cloudflare_default

networks:
  cloudflare_default:
    external: true


      


<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#16171b"/>
  <title>mdmap — Acceso</title>
  <style>
    :root {
      --bg: #16171b;
      --card: #1d1f25;
      --text: #e4e6eb;
      --muted: #8b91a0;
      --accent: #7c6cf6;
      --accent-hover: #6956eb;
      --danger: #f43f5e;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--card);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 18px; font-size: 20px; text-align: center; letter-spacing: 0.3px; }
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--bg); padding: 4px; border-radius: 10px;
      border: 1px solid var(--border); margin-bottom: 18px;
    }
    .tabs button {
      border: none; background: transparent; color: var(--muted);
      padding: 8px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .tabs button.active { background: var(--accent); color: #fff; }
    form { display: flex; flex-direction: column; gap: 12px; }
    form.hidden { display: none; }
    label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
    input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button[type="submit"] {
      margin-top: 6px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    #msg {
      margin-top: 12px; font-size: 12.5px; text-align: center;
      min-height: 18px; color: var(--danger);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>mdmap</h1>
    <div class="tabs">
      <button id="tab-login" class="active" type="button">Iniciar sesión</button>
      <button id="tab-register" type="button">Tengo invitación</button>
    </div>

    <form id="form-login">
      <label>Usuario
        <input type="text" id="login-user" autocomplete="username" required/>
      </label>
      <label>Contraseña
        <input type="password" id="login-pass" autocomplete="current-password" required/>
      </label>
      <button type="submit">Entrar</button>
    </form>

    <form id="form-register" class="hidden">
      <label>Código de invitación
        <input type="text" id="reg-code" placeholder="Ej. A1B2C3D4E5F6" required/>
      </label>
      <label>Nuevo usuario
        <input type="text" id="reg-user" autocomplete="username" minlength="3" maxlength="24" required/>
      </label>
      <label>Contraseña (mín. 8 caracteres)
        <input type="password" id="reg-pass" autocomplete="new-password" minlength="8" required/>
      </label>
      <button type="submit">Crear cuenta</button>
    </form>

    <div id="msg"></div>
  </main>

  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const msg = document.getElementById('msg');

    function setTab(mode) {
      msg.textContent = '';
      const isLogin = mode === 'login';
      tabLogin.classList.toggle('active', isLogin);
      tabRegister.classList.toggle('active', !isLogin);
      formLogin.classList.toggle('hidden', !isLogin);
      formRegister.classList.toggle('hidden', isLogin);
    }
    tabLogin.onclick = () => setTab('login');
    tabRegister.onclick = () => setTab('register');

    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('login-user').value,
          password: document.getElementById('login-pass').value
        })
      });
      if (res.ok) location.href = '/';
      else msg.textContent = (await res.json().catch(() => ({}))).error || 'Credenciales incorrectas.';
    };

    formRegister.onsubmit = async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: document.getElementById('reg-code').value,
          username: document.getElementById('reg-user').value,
          password: document.getElementById('reg-pass').value
        })
      });
      if (res.ok) location.href = '/';
      else msg.textContent = (await res.json().catch(() => ({}))).error || 'No se pudo completar el registro.';
    };
  </script>
</body>
</html>

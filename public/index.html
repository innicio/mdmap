<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Markmap Local Studio</title>
  <link rel="stylesheet" href="/assets/codemirror.css"/>
  <link rel="stylesheet" href="/assets/markmap-toolbar.css"/>
  <style>
    :root {
      --bg-bar: #1e293b;
      --text-bar: #f8fafc;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #cbd5e1;
      --bg-panel: #f1f5f9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100vh; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* Barra superior unificada */
    header {
      height: 48px; background: var(--bg-bar); color: var(--text-bar);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; font-size: 13px; gap: 10px; user-select: none;
    }
    .bar-group { display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    .brand { font-weight: 700; font-size: 15px; color: #60a5fa; margin-right: 6px; }
    
    select, button, input[type="number"] {
      background: #334155; color: #f8fafc; border: 1px solid #475569;
      padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    select:hover, button:hover { background: #475569; }
    button.active { background: var(--accent); border-color: #60a5fa; font-weight: 600; }
    button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
    button.primary:hover { background: var(--accent-hover); }
    button.danger:hover { background: #dc2626; border-color: #ef4444; }

    #save-status {
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      background: #0f172a; color: #94a3b8; min-width: 75px; text-align: center;
    }
    #save-status.saving { color: #fbbf24; }
    #save-status.saved { color: #34d399; }

    /* Contenedor principal dividido */
    #workspace {
      flex: 1; display: flex; height: calc(100vh - 48px); position: relative;
    }
    #editor-pane {
      width: 45%; min-width: 240px; max-width: 80%;
      display: flex; flex-direction: column; border-right: 1px solid var(--border);
    }
    #editor-pane.hidden { display: none; }
    .CodeMirror { flex: 1; height: 100%; font-size: 14px; line-height: 1.5; font-family: 'Fira Code', 'Consolas', monospace; }

    /* Barra inferior del editor para insertar imágenes rápido */
    #editor-footer {
      background: var(--bg-panel); border-top: 1px solid var(--border);
      padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px;
    }
    #editor-footer select { background: #fff; color: #1e293b; border-color: var(--border); }
    #editor-footer button { background: #fff; color: #1e293b; border-color: var(--border); }
    #editor-footer button:hover { background: #e2e8f0; }

    /* Divisor arrastrable */
    #resizer {
      width: 5px; cursor: col-resize; background: #e2e8f0; transition: background 0.2s;
    }
    #resizer:hover { background: var(--accent); }

    /* Panel de previsualización */
    #preview-pane {
      flex: 1; display: flex; flex-direction: column; position: relative; background: #ffffff;
    }
    svg#mindmap { flex: 1; width: 100%; height: 100%; display: block; }
    /* Limitar tamaño de imágenes dentro de los nodos del mapa para que no desborden */
    svg#mindmap img { max-height: 160px; width: auto; border-radius: 4px; display: block; margin: 4px 0; }

    /* Galería inferior plegable */
    #images-drawer {
      max-height: 170px; overflow-x: auto; overflow-y: hidden;
      border-top: 1px solid var(--border); background: #f8fafc;
      padding: 8px 12px; display: none; align-items: center; gap: 12px;
    }
    #images-drawer.visible { display: flex; }
    #images-drawer img {
      max-height: 145px; border-radius: 6px; border: 1px solid var(--border);
      cursor: zoom-in; transition: transform 0.15s; background: #fff;
    }
    #images-drawer img:hover { transform: scale(1.03); }
    .mm-toolbar-brand { display: none !important; }
  </style>
</head>
<body>

  <header>
    <!-- Grupo Izquierdo: Gestión de Archivos -->
    <div class="bar-group">
      <span class="brand">Markmap</span>
      <button id="btn-toggle-editor" title="Mostrar/Ocultar editor">⇄ Editor</button>
      <select id="file-select" title="Seleccionar documento Markdown"></select>
      <button id="btn-new-file" title="Crear nuevo archivo Markdown">+ Nuevo</button>
      <button id="btn-del-file" class="danger" title="Borrar archivo actual">🗑</button>
      <span id="save-status" class="saved">Guardado</span>
    </div>

    <!-- Grupo Central: Opciones reales de Markmap -->
    <div class="bar-group">
      <button id="btn-fit" title="Encajar mapa en pantalla">⊡ Ajustar</button>
      <button id="btn-autofit" title="Ajustar automáticamente al escribir">Auto-Fit</button>
      <button id="btn-solid-color" title="Congelar colores por rama principal">Color sólido</button>
      <button id="btn-wrap-text" title="Ajustar líneas de texto largas (maxWidth: 300px)">Ajustar texto</button>
      <button id="btn-expand-level" title="Definir nivel de despliegue inicial">Nivel máx.</button>
      <button id="btn-toggle-gallery" title="Mostrar/Ocultar cajón inferior de imágenes">🖼 Cajón Imgs</button>
    </div>

    <!-- Grupo Derecho: Exportación -->
    <div class="bar-group">
      <button id="export-svg">↓ SVG</button>
      <button id="export-html" class="primary">↓ HTML autónomo</button>
    </div>
  </header>

  <div id="workspace">
    <div id="editor-pane">
      <textarea id="markdown"></textarea>
      <div id="editor-footer">
        <div style="display:flex; gap:6px; align-items:center;">
          <span>Insertar imagen local:</span>
          <select id="img-select"><option value="">-- Seleccionar de /images --</option></select>
          <button id="btn-insert-img">Insertar en cursor</button>
          <input type="file" id="file-upload-img" accept="image/*" style="display:none"/>
          <button id="btn-upload-img" title="Subir imagen desde tu equipo a /images">↑ Subir imagen</button>
        </div>
        <button id="btn-open-url" title="Cargar Markdown desde URL externa">Cargar URL</button>
      </div>
    </div>

    <div id="resizer"></div>

    <div id="preview-pane">
      <svg id="mindmap"></svg>
      <div id="images-drawer"></div>
    </div>
  </div>

  <!-- Librerías locales -->
  <script src="/assets/d3.min.js"></script>
  <script src="/assets/markmap-lib.iife.js"></script>
  <script src="/assets/markmap-view.iife.js"></script>
  <script src="/assets/markmap-toolbar.js"></script>
  <script src="/assets/codemirror.js"></script>
  <script src="/assets/markdown.js"></script>
  <script src="/assets/continuelist.js"></script>
  <script src="/assets/placeholder.js"></script>

  <script>
  (async function(){
    const { Transformer, Markmap, Toolbar } = window.markmap;
    const transformer = new Transformer();
    const svgEl = document.getElementById('mindmap');
    const mm = Markmap.create(svgEl);

    // Toolbar flotante inferior derecha
    const tb = new Toolbar();
    tb.setBrand(false); // Desactiva la marca en la API de markmap-toolbar
    tb.attach(mm);
    const tbEl = tb.render();
    tbEl.querySelector('.mm-toolbar-brand')?.remove(); // Lo elimina del DOM por si la versión ignora setBrand
    Object.assign(tbEl.style, { position: 'absolute', bottom: '16px', right: '16px', zIndex: 10 });
    document.getElementById('preview-pane').appendChild(tbEl);

    // Inicializar CodeMirror
    const cm = CodeMirror.fromTextArea(document.getElementById('markdown'), {
      mode: 'markdown',
      lineNumbers: true,
      lineWrapping: true,
      extraKeys: { 'Enter': 'newlineAndIndentContinueMarkdownList' },
      placeholder: 'Escribe tu Markdown aquí…'
    });

    // Estado de la aplicación
    let currentFile = 'doc.md';
    let contentCache = '';
    let saveTimer = null;
    let isLoadingFile = false;

    const state = {
      autoFit: false,
      solidColor: false,
      wrapText: false,
      expandLevel: -1,
      showGallery: false
    };

    const statusEl = document.getElementById('save-status');
    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    // Extraer rutas de imágenes Markdown ![alt](url)
    function extractImagePaths(md) {
      const re = /!\[[^\]]*\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
      const out = [];
      let m;
      while ((m = re.exec(md)) !== null) out.push(m[1]);
      return [...new Set(out)];
    }

    async function urlToDataURI(url) {
      const r = await fetch(url);
      const b = await r.blob();
      return new Promise(res => {
        const fr = new FileReader();
        fr.onloadend = () => res(fr.result);
        fr.readAsDataURL(b);
      });
    }

    // Reemplaza las rutas locales por Base64 en el texto Markdown para exportaciones autónomas
    async function embedImagesInMarkdown(md) {
      const paths = extractImagePaths(md);
      let updatedMd = md;
      for (const p of paths) {
        try {
          const uri = await urlToDataURI(p);
          updatedMd = updatedMd.split(`(${p})`).join(`(${uri})`);
        } catch (e) {
          console.warn('No se pudo incrustar imagen:', p, e);
        }
      }
      return updatedMd;
    }

    // Aplicar opciones reales de markmap-view
    function applyMarkmapOptions() {
      mm.setOptions({
        colorFreezeLevel: state.solidColor ? 2 : 0,
        maxWidth: state.wrapText ? 300 : 0,
        initialExpandLevel: state.expandLevel
      });
    }

    // Renderizar mapa y actualizar cajón de imágenes
    async function render(forceFit = false) {
      const md = cm.getValue();

      // Guardado diferido (debounce 500ms) solo si el cambio viene del usuario
      if (!isLoadingFile && md !== contentCache) {
        contentCache = md;
        setStatus('Guardando...', 'saving');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          await fetch(`/api/content?file=${encodeURIComponent(currentFile)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: md
          });
          setStatus('Guardado', 'saved');
        }, 500);
      }

      applyMarkmapOptions();
      const { root } = transformer.transform(md);
      mm.setData(root);

      if (forceFit || state.autoFit) {
        requestAnimationFrame(() => mm.fit());
      }

      // Actualizar cajón de imágenes inferior si está activo
      const drawer = document.getElementById('images-drawer');
      const imgPaths = extractImagePaths(md);
      if (state.showGallery && imgPaths.length > 0) {
        drawer.classList.add('visible');
        drawer.innerHTML = '';
        for (const p of imgPaths) {
          const img = document.createElement('img');
          img.src = p;
          img.title = p;
          img.onclick = () => window.open(p, '_blank');
          drawer.appendChild(img);
        }
      } else {
        drawer.classList.remove('visible');
      }
    }

    cm.on('change', () => render(false));
    if (window.ResizeObserver) new ResizeObserver(() => mm.fit()).observe(svgEl);

    // --- Gestión de Archivos ---
    const fileSelect = document.getElementById('file-select');

    async function loadFileList(selectFile = currentFile) {
      const files = await fetch('/api/files').then(r => r.json());
      fileSelect.innerHTML = files.map(f => `<option value="${f}">${f}</option>`).join('');
      if (files.includes(selectFile)) {
        fileSelect.value = selectFile;
      } else if (files.length > 0) {
        fileSelect.value = files[0];
      }
      await loadDocument(fileSelect.value);
    }

    async function loadDocument(filename) {
      isLoadingFile = true;
      currentFile = filename;
      const content = await fetch(`/api/content?file=${encodeURIComponent(filename)}`).then(r => r.text());
      contentCache = content;
      cm.setValue(content);
      isLoadingFile = false;
      setStatus('Guardado', 'saved');
      render(true); // Encajar mapa al abrir documento nuevo
    }

    fileSelect.onchange = () => loadDocument(fileSelect.value);

    document.getElementById('btn-new-file').onclick = async () => {
      let name = prompt('Nombre del nuevo archivo (ej. diabetes.md):');
      if (!name) return;
      if (!name.endsWith('.md')) name += '.md';
      await fetch(`/api/content?file=${encodeURIComponent(name)}`, {
        method: 'POST',
        body: `# ${name.replace('.md', '')}\n\n## Sección 1\n- Punto A`
      });
      await loadFileList(name);
    };

    document.getElementById('btn-del-file').onclick = async () => {
      if (currentFile === 'doc.md') return alert('El archivo base doc.md no se puede eliminar.');
      if (!confirm(`¿Seguro que quieres eliminar "${currentFile}"?`)) return;
      await fetch(`/api/content?file=${encodeURIComponent(currentFile)}`, { method: 'DELETE' });
      await loadFileList('doc.md');
    };

    // --- Selector y subida de imágenes locales ---
    const imgSelect = document.getElementById('img-select');
    async function refreshImageList(selected = '') {
      const imgs = await fetch('/api/images').then(r => r.json());
      imgSelect.innerHTML = '<option value="">-- Seleccionar de /images --</option>' +
        imgs.map(i => `<option value="/images/${i}">${i}</option>`).join('');
      if (selected) imgSelect.value = `/images/${selected}`;
    }
    await refreshImageList();

    const fileUploadImg = document.getElementById('file-upload-img');
    document.getElementById('btn-upload-img').onclick = () => fileUploadImg.click();
    fileUploadImg.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = async () => {
        const res = await fetch(`/api/images?name=${encodeURIComponent(file.name)}`, {
          method: 'POST',
          body: reader.result
        });
        if (res.ok) {
          await refreshImageList(file.name);
          const nameNoExt = file.name.replace(/\.[^.]+$/, '');
          cm.replaceSelection(`![${nameNoExt}](/images/${file.name})`);
          cm.focus();
        } else {
          alert('Error al subir la imagen');
        }
        fileUploadImg.value = '';
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('btn-insert-img').onclick = () => {
      const val = imgSelect.value;
      if (!val) return;
      const name = val.split('/').pop().replace(/\.[^.]+$/, '');
      cm.replaceSelection(`![${name}](${val})`);
      cm.focus();
    };

    // --- Botones de la barra de herramientas ---
    document.getElementById('btn-toggle-editor').onclick = function() {
      const pane = document.getElementById('editor-pane');
      pane.classList.toggle('hidden');
      setTimeout(() => mm.fit(), 50);
    };

    document.getElementById('btn-fit').onclick = () => mm.fit();

    document.getElementById('btn-autofit').onclick = function() {
      state.autoFit = !state.autoFit;
      this.classList.toggle('active', state.autoFit);
    };

    document.getElementById('btn-solid-color').onclick = function() {
      state.solidColor = !state.solidColor;
      this.classList.toggle('active', state.solidColor);
      render(false);
    };

    document.getElementById('btn-wrap-text').onclick = function() {
      state.wrapText = !state.wrapText;
      this.classList.toggle('active', state.wrapText);
      render(true);
    };

    document.getElementById('btn-expand-level').onclick = function() {
      const current = state.expandLevel > 0 ? state.expandLevel : '';
      const input = prompt('Nivel máximo desplegado (deja vacío para desplegar todo):', current);
      if (input === null) return;
      const n = parseInt(input, 10);
      state.expandLevel = isNaN(n) ? -1 : n;
      this.classList.toggle('active', state.expandLevel > 0);
      this.textContent = state.expandLevel > 0 ? `Nivel máx: ${state.expandLevel}` : 'Nivel máx.';
      render(true);
    };

    document.getElementById('btn-toggle-gallery').onclick = function() {
      state.showGallery = !state.showGallery;
      this.classList.toggle('active', state.showGallery);
      render(false);
    };

    document.getElementById('btn-open-url').onclick = async () => {
      const url = prompt('Introduce la URL del archivo Markdown:');
      if (url) cm.setValue(await fetch(url).then(r => r.text()));
    };

    // --- Divisor arrastrable (Resizer) ---
    const resizer = document.getElementById('resizer');
    const editorPane = document.getElementById('editor-pane');
    resizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const onMove = (ev) => {
        const newWidth = (ev.clientX / window.innerWidth) * 100;
        if (newWidth > 15 && newWidth < 85) editorPane.style.width = `${newWidth}%`;
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        mm.fit();
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });

    // --- Exportar SVG (Limpio y con imágenes en Base64) ---
    document.getElementById('export-svg').onclick = async () => {
      const cloneSvg = svgEl.cloneNode(true);
      cloneSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      cloneSvg.setAttribute('width', svgEl.clientWidth);
      cloneSvg.setAttribute('height', svgEl.clientHeight);

      // Convertir imágenes dentro del SVG a DataURI para que no se rompan fuera del servidor
      const imgs = cloneSvg.querySelectorAll('img');
      for (const img of imgs) {
        const src = img.getAttribute('src');
        if (src && !src.startsWith('data:')) {
          try { img.setAttribute('src', await urlToDataURI(src)); } catch(e){}
        }
      }

      const svgData = new XMLSerializer().serializeToString(cloneSvg);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentFile.replace('.md', '')}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    };

    // --- Exportar HTML Autónomo (Todo offline e imágenes Base64 dentro de los nodos) ---
    document.getElementById('export-html').onclick = async () => {
      const rawMd = cm.getValue();
      const embeddedMd = await embedImagesInMarkdown(rawMd);

      const [d3js, libjs, viewjs, cssTB, jsTB] = await Promise.all([
        fetch('/assets/d3.min.js').then(r => r.text()),
        fetch('/assets/markmap-lib.iife.js').then(r => r.text()),
        fetch('/assets/markmap-view.iife.js').then(r => r.text()),
        fetch('/assets/markmap-toolbar.css').then(r => r.text()),
        fetch('/assets/markmap-toolbar.js').then(r => r.text()),
      ]);

      const exportOptions = JSON.stringify({
        colorFreezeLevel: state.solidColor ? 2 : 0,
        maxWidth: state.wrapText ? 300 : 0,
        initialExpandLevel: state.expandLevel
      });

      const html = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>${currentFile.replace('.md', '')} - Markmap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #mindmap { width: 100vw; height: 100vh; display: block; font-family: sans-serif; }
    svg#mindmap img { max-height: 160px; width: auto; border-radius: 4px; display: block; margin: 4px 0; }
    ${cssTB}
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script>${d3js}<\/script>
  <script>${libjs}<\/script>
  <script>${viewjs}<\/script>
  <script>${jsTB}<\/script>
  <script>
    const { Transformer, Markmap, Toolbar } = window.markmap;
    const transformer = new Transformer();
    const svgEl = document.getElementById("mindmap");
    const mm = Markmap.create(svgEl, ${exportOptions});
    const { root } = transformer.transform(${JSON.stringify(embeddedMd)});
    mm.setData(root);
    setTimeout(() => mm.fit(), 50);
    window.addEventListener("resize", () => mm.fit());
    const tb = new Toolbar();
    tb.setBrand(false);
    tb.attach(mm);
    const el = tb.render();
    el.querySelector(".mm-toolbar-brand")?.remove();
    Object.assign(el.style, { position: "absolute", bottom: "20px", right: "20px" });
    document.body.appendChild(el);
  <\/script>
</body>
</html>`;

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentFile.replace('.md', '')}.html`;
      a.click();
      URL.revokeObjectURL(url);
    };

    // Carga inicial limpia (sin doble render)
    await loadFileList('doc.md');
  })();
  </script>
</body>
</html>

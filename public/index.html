<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#1e1e1e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Markmap & Knit Studio</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/api/pwa-icon?size=192"/>
  <link rel="stylesheet" href="/assets/codemirror.css"/>
  <link rel="stylesheet" href="/assets/markmap-toolbar.css"/>
  <!-- KaTeX y Marked en el head para compilación instantánea en la carga inicial -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252526;
      --bg-elevated: rgba(37, 37, 38, 0.94);
      --text-normal: #dcddde;
      --text-muted: #8e8e93;
      --accent: #7f6df2;
      --accent-hover: #6955e0;
      --danger: #e11d48;
      --border: #333333;
      --header-h: 46px;
      --line-width: 68ch;
    }

    body.theme-light {
      --bg-primary: #ffffff;
      --bg-secondary: #f3f4f6;
      --bg-elevated: rgba(243, 244, 246, 0.94);
      --text-normal: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100dvh;
      background: var(--bg-primary); color: var(--text-normal);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; overscroll-behavior-y: none;
    }

    button, select, input[type="text"] {
      background: var(--bg-primary); color: var(--text-normal);
      border: 1px solid var(--border); padding: 5px 10px;
      border-radius: 6px; font-size: 12px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active, button.primary {
      background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .icon-btn { font-size: 15px; padding: 5px 8px; background: transparent; border-color: transparent; }
    .icon-btn:hover { background: rgba(127, 109, 242, 0.15); }

    /* Indicador Pull-Down y Paleta de Comandos */
    #pull-indicator {
      position: fixed; top: -40px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff; padding: 6px 16px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
      z-index: 90; transition: top 0.2s; pointer-events: none;
    }
    #pull-indicator.visible { top: 12px; }

    #command-palette-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px); z-index: 100;
      display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh;
    }
    #command-palette-backdrop.hidden { display: none !important; }
    #command-palette {
      width: 90%; max-width: 520px; background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden;
    }
    #cmd-input {
      width: 100%; border: none; border-bottom: 1px solid var(--border);
      padding: 14px 16px; font-size: 15px; background: var(--bg-primary); color: var(--text-normal); outline: none; border-radius: 0;
    }
    #cmd-results { max-height: 55vh; overflow-y: auto; padding: 6px; }
    .cmd-item {
      padding: 10px 12px; border-radius: 6px; cursor: pointer;
      display: flex; justify-content: space-between; font-size: 13px;
    }
    .cmd-item:hover { background: var(--accent); color: #fff; }

    /* Cabecera Superior */
    #app-header {
      height: var(--header-h); background: var(--bg-elevated);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px; position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      gap: 8px; overflow-x: auto; white-space: nowrap;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.bars-hidden #app-header { transform: translateY(-100%); }
    .header-group { display: flex; align-items: center; gap: 6px; }
    #active-file-breadcrumb {
      font-size: 13px; font-weight: 600; max-width: 170px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #save-status { font-size: 11px; padding: 2px 7px; border-radius: 10px; }
    #save-status.saving { color: #fbbf24; }
    #save-status.saved { color: #34d399; }

    /* Layout Base de Escritorio: 3 Columnas */
    #app-workspace {
      display: grid;
      grid-template-columns: 240px 1fr 260px;
      height: 100dvh; padding-top: var(--header-h);
      transition: grid-template-columns 0.2s ease;
    }
    #app-workspace.hide-left { grid-template-columns: 0px 1fr 260px; }
    #app-workspace.hide-right { grid-template-columns: 240px 1fr 0px; }
    #app-workspace.hide-left.hide-right { grid-template-columns: 0px 1fr 0px; }

    .drawer {
      background: var(--bg-secondary); border-right: 1px solid var(--border);
      overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #right-sidebar { border-right: none; border-left: 1px solid var(--border); padding: 12px; gap: 14px; }

    /* Sidebar Izquierdo: Archivos y Tags */
    .sb-section { padding: 10px; border-bottom: 1px solid var(--border); }
    #sb-search { width: 100%; }
    #sb-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag-pill {
      background: var(--bg-primary); color: var(--text-muted); padding: 2px 8px;
      border-radius: 10px; font-size: 11px; cursor: pointer; border: 1px solid var(--border);
    }
    .tag-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #sb-tree { flex: 1; overflow-y: auto; padding: 6px 0; }
    .folder-title {
      padding: 6px 12px; font-weight: 700; color: var(--text-muted);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;
    }
    .file-item {
      padding: 7px 12px 7px 20px; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-normal);
    }
    .file-item:hover { background: rgba(127, 109, 242, 0.1); }
    .file-item.active {
      background: rgba(127, 109, 242, 0.2); color: #fff;
      font-weight: 600; border-left: 3px solid var(--accent);
    }
    body.theme-light .file-item.active { color: var(--accent); }
    .file-tags { font-size: 10px; color: var(--text-muted); margin-left: 6px; }
    .sb-footer { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 5px; }
    .sb-footer button { flex: 1; padding: 5px 6px; font-size: 11px; }
    .sb-footer button.danger { flex: 0 0 32px; }

    /* Escenario Central: Editor + Visor Dual (Mapa / Knit) */
    #center-stage { display: flex; height: 100%; overflow: hidden; position: relative; }
    #editor-container {
      width: 45%; min-width: 220px; height: 100%;
      display: flex; flex-direction: column; background: var(--bg-primary);
      border-right: 1px solid var(--border);
    }
    #editor-container.hidden { display: none !important; }
    .CodeMirror {
      flex: 1; height: 100%; font-size: 14.5px; line-height: 1.6;
      background: var(--bg-primary) !important; color: var(--text-normal) !important;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }
    .CodeMirror-gutters { background: var(--bg-secondary) !important; border-right: 1px solid var(--border) !important; }
    .CodeMirror-cursor { border-left: 2px solid var(--accent) !important; }
    #editor-container.readable-line-length .CodeMirror-lines {
      max-width: var(--line-width); margin: 0 auto; padding: 16px 10px;
    }

    #resizer { width: 5px; cursor: col-resize; background: var(--border); transition: background 0.2s; }
    #resizer:hover { background: var(--accent); }

    #viewer-container { flex: 1; height: 100%; position: relative; display: flex; flex-direction: column; background: var(--bg-primary); overflow: hidden; }
    svg#mindmap { flex: 1; width: 100%; height: 100%; display: block; color: var(--text-normal); }
    svg#mindmap.hidden { display: none !important; }
    svg#mindmap img { max-height: 160px; width: auto; border-radius: 4px; display: block; margin: 4px 0; }
    .mm-toolbar-brand { display: none !important; }

    /* --- Visor en vivo estilo RMarkdown (Knit) con TOC flotante --- */
    #knit-viewer {
      flex: 1; display: none; height: 100%; overflow: hidden;
      background: #ffffff; color: #2c3e50; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #knit-viewer.active { display: flex; }
    #knit-toc {
      width: 220px; min-width: 180px; border-right: 1px solid #e2e8f0;
      background: #f8fafc; padding: 18px 12px; overflow-y: auto; font-size: 13px;
    }
    #knit-toc h4 { margin: 0 0 10px 0; font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; }
    #knit-toc a {
      display: block; color: #475569; text-decoration: none; padding: 5px 8px;
      border-radius: 4px; margin-bottom: 2px; line-height: 1.35;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #knit-toc a:hover { background: #e2e8f0; color: #0f172a; }
    #knit-toc a.toc-h2 { padding-left: 18px; font-size: 12.5px; }
    #knit-toc a.toc-h3 { padding-left: 30px; font-size: 12px; color: #64748b; }

    #knit-content { flex: 1; overflow-y: auto; padding: 32px 40px; scroll-behavior: smooth; }
    .knit-body { max-width: 800px; margin: 0 auto; line-height: 1.7; font-size: 15.5px; }
    .knit-body h1 { font-size: 1.9em; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 0; color: #0f172a; }
    .knit-body h2 { font-size: 1.45em; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-top: 1.6em; color: #1e293b; }
    .knit-body h3 { font-size: 1.2em; margin-top: 1.3em; color: #334155; }
    .knit-body img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 16px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .knit-body table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
    .knit-body th, .knit-body td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
    .knit-body th { background: #f1f5f9; font-weight: 600; }
    .knit-body tr:nth-child(even) { background: #f8fafc; }
    .knit-body pre { background: #f1f5f9; padding: 12px 16px; border-radius: 6px; overflow-x: auto; border: 1px solid #e2e8f0; font-size: 13.5px; }
    .knit-body code { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    .knit-body blockquote { border-left: 4px solid var(--accent); margin: 16px 0; padding: 4px 16px; color: #475569; background: #f8fafc; }

    /* Columna Derecha: Metadatos, Opciones y Exportación */
    .meta-section { display: flex; flex-direction: column; gap: 7px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .meta-section h4 { margin: 0 0 3px 0; font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row button { flex: 1; }
    #images-drawer {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
      max-height: 200px; overflow-y: auto; margin-top: 4px;
    }
    #images-drawer img {
      width: 100%; height: 65px; object-fit: cover; border-radius: 4px;
      border: 1px solid var(--border); cursor: pointer; background: #fff;
    }

    /* --- Barra Inferior Conmutable (Inicialmente Oculta) y Botón Sutil --- */
    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg-elevated); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 30; transform: translateY(105%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #bottom-nav.visible { transform: translateY(0); }
    #bottom-nav button {
      background: transparent; border: none; font-size: 13px;
      padding: 6px 10px; color: var(--text-normal);
    }
    #bottom-nav button:hover { color: var(--accent); }

    #btn-toggle-bottom-bar {
      position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);
      z-index: 31; background: var(--bg-secondary); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 12px; padding: 2px 12px;
      font-size: 10px; opacity: 0.55; transition: opacity 0.2s, bottom 0.25s;
    }
    #btn-toggle-bottom-bar:hover { opacity: 1; color: var(--text-normal); }
    #btn-toggle-bottom-bar.bar-open { bottom: 54px; opacity: 0.9; }

    /* Barra Contextual sobre el Teclado Virtual (Móvil) */
    #keyboard-toolbar {
      position: fixed; left: 0; right: 0;
      bottom: var(--kb-offset, 0px);
      height: 44px; background: var(--bg-secondary);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px; padding: 0 10px;
      overflow-x: auto; white-space: nowrap; z-index: 35;
      scrollbar-width: none;
    }
    #keyboard-toolbar::-webkit-scrollbar { display: none; }
    #keyboard-toolbar.hidden { display: none !important; }
    #keyboard-toolbar button { flex: 0 0 auto; padding: 5px 10px; font-size: 13px; }

    .mobile-only { display: none !important; }
    #drawer-backdrop { display: none; }

    /* ====================================================================
       MEDIA QUERY MÓVIL (< 768px)
       ==================================================================== */
    @media (max-width: 768px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: inline-flex !important; }

      #app-workspace {
        display: block; position: relative;
        height: 100dvh; padding-top: var(--header-h);
      }
      body.bars-hidden #app-workspace { padding-top: 0; }

      #editor-container, #viewer-container { width: 100% !important; height: 100%; border: none; }
      #center-stage[data-mobile-view="editor"] #viewer-container { display: none !important; }
      #center-stage[data-mobile-view="viewer"] #editor-container { display: none !important; }

      .drawer {
        position: fixed; top: 0; bottom: 0; width: 82vw; max-width: 310px;
        z-index: 50; box-shadow: 0 10px 35px rgba(0,0,0,0.6);
      }
      #left-sidebar { left: 0; transform: translateX(-105%); }
      #right-sidebar { right: 0; transform: translateX(105%); }
      #left-sidebar.open, #right-sidebar.open { transform: translateX(0); }

      #drawer-backdrop {
        display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
        backdrop-filter: blur(2px); z-index: 40;
        opacity: 0; pointer-events: none; transition: opacity 0.25s;
      }
      #drawer-backdrop.visible { opacity: 1; pointer-events: auto; }

      #knit-toc { display: none; }
      #knit-content { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <div id="pull-indicator">↓ Suelta para abrir Paleta de Comandos</div>

  <div id="command-palette-backdrop" class="hidden">
    <div id="command-palette">
      <input type="text" id="cmd-input" placeholder="Escribe un comando o busca una nota..."/>
      <div id="cmd-results"></div>
    </div>
  </div>

  <!-- Barra Superior -->
  <header id="app-header">
    <div class="header-group">
      <button id="btn-left-drawer" class="icon-btn" title="Mostrar/Ocultar Archivos">📁</button>
      <span id="active-file-breadcrumb">doc.md</span>
      <span id="save-status" class="saved">Guardado</span>
    </div>

    <div class="header-group">
      <button id="btn-toggle-editor-desktop" class="desktop-only active" title="Mostrar/Ocultar Editor">⇄ Editor</button>
      <button id="btn-switch-mobile" class="mobile-only primary" title="Alternar entre Editor y Visor">🗺️ Ver Salida</button>
      <button id="btn-view-mode" class="primary" title="Cambiar salida en vivo entre Mapa Mental y Documento Maquetado (Knit)">📄 Vista Doc / Knit</button>
      <button id="btn-fit" class="desktop-only" title="Encajar mapa">⊡ Ajustar</button>
      <button id="btn-solid-color" class="desktop-only" title="Color sólido por rama">Color sólido</button>
      <button id="btn-wrap-text" class="desktop-only" title="Ajustar ancho de texto">Ajustar texto</button>
    </div>

    <div class="header-group">
      <button id="btn-theme" class="icon-btn" title="Cambiar Tema Claro/Oscuro">🌓</button>
      <button id="btn-cmd-top" class="icon-btn" title="Paleta de Comandos">⚡</button>
      <button id="btn-right-drawer" class="icon-btn" title="Opciones y Exportación">⚙️</button>
    </div>
  </header>

  <!-- Área de Trabajo de 3 Columnas -->
  <main id="app-workspace">
    <div id="drawer-backdrop"></div>

    <!-- 1. Columna Izquierda: Explorador de Archivos y Tags -->
    <aside id="left-sidebar" class="drawer">
      <div class="sb-section">
        <input type="text" id="sb-search" placeholder="🔍 Buscar nota o #tag..."/>
        <div id="sb-tags"></div>
      </div>
      <div id="sb-tree"></div>
      <div class="sb-footer">
        <button id="btn-new-file" class="primary">+ Nueva</button>
        <button id="btn-rename-file" title="Renombrar o mover nota actual">✏️ Renombrar</button>
        <button id="btn-del-file" class="danger" title="Eliminar nota actual">🗑</button>
      </div>
    </aside>

    <!-- 2. Columna Central: Editor Markdown + Visor Dual (Mapa / Knit) -->
    <section id="center-stage" data-mobile-view="editor">
      <div id="editor-container" class="readable-line-length">
        <textarea id="markdown"></textarea>
      </div>
      <div id="resizer" class="desktop-only"></div>
      <div id="viewer-container">
        <svg id="mindmap"></svg>
        <div id="knit-viewer">
          <nav id="knit-toc"><h4>Contenido</h4><div id="knit-toc-list"></div></nav>
          <div id="knit-content"><article class="knit-body" id="knit-body"></article></div>
        </div>
      </div>
    </section>

    <!-- 3. Columna Derecha: Opciones del Mapa, Imágenes y Exportación -->
    <aside id="right-sidebar" class="drawer">
      <div class="meta-section">
        <h4>Opciones de Visualización</h4>
        <button id="btn-fit-side">⊡ Encajar mapa en pantalla</button>
        <button id="btn-autofit">Auto-Fit al escribir</button>
        <button id="btn-solid-side">Color sólido por rama</button>
        <button id="btn-wrap-side">Ajustar ancho de nodo</button>
        <button id="btn-expand-level">Nivel máx. desplegado</button>
        <button id="btn-line-width" class="active">Ancho lectura confortable</button>
      </div>

      <div class="meta-section">
        <h4>Imágenes Locales (/images)</h4>
        <select id="img-select"><option value="">-- Seleccionar imagen --</option></select>
        <div class="btn-row">
          <button id="btn-insert-img">Insertar en nota</button>
          <button id="btn-upload-img">↑ Subir</button>
          <input type="file" id="file-upload-img" accept="image/*" style="display:none"/>
        </div>
        <div id="images-drawer"></div>
      </div>

      <div class="meta-section">
        <h4>Acciones y Exportación</h4>
        <button id="btn-open-url">🌐 Cargar Markdown desde URL</button>
        <div class="btn-row">
          <button id="export-svg" title="Descargar Mapa en SVG">↓ SVG</button>
          <button id="export-html" title="Descargar Mapa Interactivo HTML">↓ Mapa HTML</button>
        </div>
        <div class="btn-row">
          <button id="export-knit" class="primary" title="Descargar Documento HTML estilo RStudio Knit">↓ Knit HTML</button>
          <button id="export-pdf" class="primary" title="Generar PDF estilo LaTeX">↓ PDF</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Barra Contextual sobre el Teclado Virtual (Móvil) -->
  <div id="keyboard-toolbar" class="hidden">
    <button data-insert="**|**"><b>B</b></button>
    <button data-insert="*|*"><i>I</i></button>
    <button data-insert="# ">H1</button>
    <button data-insert="## ">H2</button>
    <button data-insert="### ">H3</button>
    <button data-insert="- ">• Lista</button>
    <button data-insert="- [ ] ">☑ Tarea</button>
    <button data-insert="$$\n|\n$$">∑ LaTeX</button>
    <button id="kb-img">🖼 Img</button>
    <button id="kb-indent">⇥ Tab</button>
    <button id="kb-close">⌨️↓</button>
  </div>

  <!-- Botón Sutil y Barra Inferior Conmutable (Inicialmente Desactivada) -->
  <button id="btn-toggle-bottom-bar" title="Mostrar/Ocultar barra rápida inferior">⌃ Barra</button>
  <nav id="bottom-nav">
    <button id="nav-undo" title="Deshacer cambio en editor (o ir a nota anterior)">↩ Deshacer</button>
    <button id="nav-redo" title="Rehacer cambio en editor (o ir a nota siguiente)">↪ Rehacer</button>
    <button id="nav-files" title="Abrir/Cerrar Archivos">📁 Archivos</button>
    <button id="nav-view" title="Alternar Vista Mapa / Vista Doc Knit">📄/🗺️ Modo</button>
    <button id="nav-cmd" title="Paleta de Comandos">⚡ Comandos</button>
    <button id="nav-meta" title="Abrir/Cerrar Opciones">⚙️ Opciones</button>
  </nav>

  <!-- Librerías Locales -->
  <script src="/assets/d3.min.js"></script>
  <script src="/assets/markmap-lib.iife.js"></script>
  <script src="/assets/markmap-view.iife.js"></script>
  <script src="/assets/markmap-toolbar.js"></script>
  <script src="/assets/codemirror.js"></script>
  <script src="/assets/markdown.js"></script>
  <script src="/assets/continuelist.js"></script>
  <script src="/assets/placeholder.js"></script>

  <script>
  (async function(){
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    const { Transformer, Markmap, Toolbar, loadCSS, loadJS } = window.markmap;
    const transformer = new Transformer();
    const svgEl = document.getElementById('mindmap');
    const mm = Markmap.create(svgEl);

    const tb = new Toolbar();
    if (tb.setBrand) tb.setBrand(false);
    tb.attach(mm);
    const tbEl = tb.render();
    tbEl.querySelector('.mm-toolbar-brand')?.remove();
    Object.assign(tbEl.style, { position: 'absolute', bottom: '16px', right: '16px', zIndex: 10 });
    document.getElementById('viewer-container').appendChild(tbEl);

    const cm = CodeMirror.fromTextArea(document.getElementById('markdown'), {
      mode: 'markdown',
      lineNumbers: true,
      lineWrapping: true,
      extraKeys: { 'Enter': 'newlineAndIndentContinueMarkdownList' },
      placeholder: 'Escribe tu nota en Markdown aquí…'
    });

    let currentFile = 'doc.md';
    let contentCache = '';
    let saveTimer = null;
    let isLoadingFile = false;
    let isKnitView = false;
    let allFiles = [];
    let activeTag = null;
    const navHistory = [];
    let navIndex = -1;

    const state = {
      autoFit: false,
      colorFreezeLevel: 0,
      maxWidth: 0,
      expandLevel: -1
    };

    const statusEl = document.getElementById('save-status');
    const breadcrumbEl = document.getElementById('active-file-breadcrumb');
    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function extractImagePaths(md) {
      const re = /!\[[^\]]*\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
      const out = [];
      let m;
      while ((m = re.exec(md)) !== null) out.push(m[1]);
      return [...new Set(out)];
    }

    async function urlToDataURI(url) {
      const r = await fetch(url);
      const b = await r.blob();
      return new Promise(res => {
        const fr = new FileReader();
        fr.onloadend = () => res(fr.result);
        fr.readAsDataURL(b);
      });
    }

    async function embedImagesInMarkdown(md) {
      const paths = extractImagePaths(md);
      let updatedMd = md;
      for (const p of paths) {
        try {
          const uri = await urlToDataURI(p);
          updatedMd = updatedMd.split(`(${p})`).join(`(${uri})`);
        } catch (e) {}
      }
      return updatedMd;
    }

    const palette = d3.scaleOrdinal(d3.schemeCategory10);
    function getMarkmapOptions() {
      const freeze = state.colorFreezeLevel;
      const rawOpts = {
        colorFreezeLevel: freeze,
        maxWidth: state.maxWidth > 0 ? state.maxWidth : 0,
        initialExpandLevel: state.expandLevel
      };
      const derived = window.markmap.deriveOptions ? window.markmap.deriveOptions(rawOpts) : rawOpts;
      derived.color = (node) => {
        const pathParts = String(node.state?.path || node.depth || '0').split('.');
        const key = freeze > 0 ? pathParts.slice(0, freeze).join('.') : pathParts.join('.');
        return palette(key);
      };
      return derived;
    }

    // --- Compilador de Documento Maquetado (Estilo RStudio Knit + KaTeX + TOC) ---
    function compileKnitHtml(rawMd) {
      let cleanMd = rawMd.replace(/^---\n([\s\S]*?)\n---\n?/, '');
      const mathBlocks = [];

      cleanMd = cleanMd.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
        const html = window.katex ? katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false }) : `$$${tex}$$`;
        mathBlocks.push(html);
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });
      cleanMd = cleanMd.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
        const html = window.katex ? katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false }) : `$${tex}$`;
        mathBlocks.push(html);
        return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
      });

      let bodyHtml = window.marked ? marked.parse(cleanMd) : cleanMd;
      bodyHtml = bodyHtml.replace(/@@MATH_BLOCK_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = bodyHtml;
      const tocItems = [];
      tempDiv.querySelectorAll('h1, h2, h3').forEach((h, i) => {
        const id = `sec-${i}`;
        h.id = id;
        const level = h.tagName.toLowerCase();
        tocItems.push(`<a href="#${id}" class="toc-${level}">${h.textContent}</a>`);
      });

      return { bodyHtml: tempDiv.innerHTML, tocHtml: tocItems.join('') };
    }

    function updateKnitPreview() {
      if (!isKnitView) return;
      const { bodyHtml, tocHtml } = compileKnitHtml(cm.getValue());
      document.getElementById('knit-body').innerHTML = bodyHtml;
      document.getElementById('knit-toc-list').innerHTML = tocHtml || '<small style="color:#94a3b8">Sin encabezados</small>';
    }

    async function render(forceFit = false) {
      const md = cm.getValue();

      if (!isLoadingFile && md !== contentCache) {
        contentCache = md;
        setStatus('Guardando...', 'saving');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          await fetch(`/api/content?file=${encodeURIComponent(currentFile)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: md
          });
          setStatus('Guardado', 'saved');
          refreshSidebarMetadata();
        }, 500);
      }

      if (isKnitView) {
        updateKnitPreview();
      } else {
        const { root, features } = transformer.transform(md);
        const { styles, scripts } = transformer.getUsedAssets(features);
        if (styles && loadCSS) loadCSS(styles);
        if (scripts && loadJS) await loadJS(scripts, { getMarkmap: () => window.markmap });

        const opts = getMarkmapOptions();
        mm.setOptions(opts);
        mm.setData(root, opts);

        if (forceFit || state.autoFit) {
          requestAnimationFrame(() => mm.fit());
        }
      }

      const drawer = document.getElementById('images-drawer');
      const imgPaths = extractImagePaths(md);
      drawer.innerHTML = '';
      for (const p of imgPaths) {
        const img = document.createElement('img');
        img.src = p;
        img.title = p;
        img.onclick = () => window.open(p, '_blank');
        drawer.appendChild(img);
      }
    }

    cm.on('change', () => render(false));
    if (window.ResizeObserver) new ResizeObserver(() => { if (!isKnitView) mm.fit(); }).observe(svgEl);

    // --- Alternar entre Mapa Mental y Documento Maquetado (Knit) ---
    function toggleViewMode() {
      isKnitView = !isKnitView;
      const knitEl = document.getElementById('knit-viewer');
      const btnMode = document.getElementById('btn-view-mode');
      knitEl.classList.toggle('active', isKnitView);
      svgEl.classList.toggle('hidden', isKnitView);
      tbEl.style.display = isKnitView ? 'none' : '';
      btnMode.textContent = isKnitView ? '🗺️ Vista Mapa' : '📄 Vista Doc / Knit';
      render(true);
    }
    document.getElementById('btn-view-mode').onclick = toggleViewMode;
    document.getElementById('nav-view').onclick = toggleViewMode;

    // --- Gestión de Archivos y Árbol Lateral ---
    async function refreshSidebarMetadata() {
      const raw = await fetch('/api/files').then(r => r.json());
      allFiles = (Array.isArray(raw) ? raw : []).map(item => {
        if (typeof item === 'string') {
          return { path: item, name: item.split('/').pop(), folder: '', tags: [] };
        }
        return {
          path: item.path || item.name || 'doc.md',
          name: item.name || item.path || 'doc.md',
          folder: item.folder || '',
          tags: Array.isArray(item.tags) ? item.tags : []
        };
      });
      renderSidebar();
    }

    async function loadFileList(selectFile = currentFile) {
      await refreshSidebarMetadata();
      const exists = allFiles.some(f => f.path === selectFile);
      const target = exists ? selectFile : (allFiles[0]?.path || 'doc.md');
      await loadDocument(target, true);
      renderSidebar();
    }

    function renderSidebar() {
      const q = document.getElementById('sb-search').value.toLowerCase();
      const tagsContainer = document.getElementById('sb-tags');
      const treeContainer = document.getElementById('sb-tree');

      const tagSet = new Set();
      allFiles.forEach(f => (f.tags || []).forEach(t => tagSet.add(t)));
      tagsContainer.innerHTML = [...tagSet].map(t =>
        `<span class="tag-pill ${activeTag === t ? 'active' : ''}" data-tag="${t}">#${t}</span>`
      ).join('');
      tagsContainer.querySelectorAll('.tag-pill').forEach(el => {
        el.onclick = () => {
          activeTag = (activeTag === el.dataset.tag) ? null : el.dataset.tag;
          renderSidebar();
        };
      });

      const filtered = allFiles.filter(f => {
        const matchText = f.path.toLowerCase().includes(q);
        const matchTag = !activeTag || (f.tags || []).includes(activeTag);
        return matchText && matchTag;
      });

      const groups = {};
      filtered.forEach(f => {
        const folderName = f.folder || 'Raíz (/)';
        if (!groups[folderName]) groups[folderName] = [];
        groups[folderName].push(f);
      });

      treeContainer.innerHTML = Object.keys(groups).sort().map(folder => {
        const itemsHtml = groups[folder].map(f => `
          <div class="file-item ${f.path === currentFile ? 'active' : ''}" data-path="${f.path}">
            <span>📄 ${f.name.replace(/\.md$/, '')}</span>
            <span class="file-tags">${(f.tags || []).map(t => '#' + t).join(' ')}</span>
          </div>
        `).join('');
        return `<div class="folder-title">📁 ${folder}</div>${itemsHtml}`;
      }).join('');

      treeContainer.querySelectorAll('.file-item').forEach(el => {
        el.onclick = async () => {
          await loadDocument(el.dataset.path, true);
          renderSidebar();
          closeMobileDrawers();
        };
      });
    }

    async function loadDocument(filename, pushHistory = false) {
      isLoadingFile = true;
      currentFile = filename;
      breadcrumbEl.textContent = filename;
      if (pushHistory && navHistory[navIndex] !== filename) {
        navHistory.splice(navIndex + 1);
        navHistory.push(filename);
        navIndex = navHistory.length - 1;
      }
      const content = await fetch(`/api/content?file=${encodeURIComponent(filename)}`).then(r => r.text());
      contentCache = content;
      cm.setValue(content);
      cm.clearHistory();
      isLoadingFile = false;
      setStatus('Guardado', 'saved');
      await render(true);
    }

    document.getElementById('sb-search').oninput = renderSidebar;

    document.getElementById('btn-new-file').onclick = async () => {
      let name = prompt('Nombre del nuevo archivo (ej. clinica/insulina.md):');
      if (!name) return;
      if (!name.endsWith('.md')) name += '.md';
      const title = name.split('/').pop().replace('.md', '');
      const initialMd = `---\ntags: [general]\n---\n# ${title}\n\n## Apartado 1\n- Idea A`;
      await fetch(`/api/content?file=${encodeURIComponent(name)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: initialMd
      });
      await loadFileList(name);
      closeMobileDrawers();
    };

    document.getElementById('btn-rename-file').onclick = async () => {
      if (currentFile === 'doc.md') return alert('El archivo base doc.md no se puede renombrar.');
      const newName = prompt('Nuevo nombre o ruta (ej. clinica/protocolo.md):', currentFile);
      if (!newName || newName === currentFile) return;
      const res = await fetch(`/api/rename?old=${encodeURIComponent(currentFile)}&new=${encodeURIComponent(newName)}`, {
        method: 'POST'
      });
      if (res.ok) {
        const updatedPath = await res.text();
        await loadFileList(updatedPath);
      } else {
        alert('Error al renombrar el archivo.');
      }
    };

    document.getElementById('btn-del-file').onclick = async () => {
      if (currentFile === 'doc.md') return alert('El archivo base doc.md no se puede eliminar.');
      if (!confirm(`¿Seguro que quieres eliminar "${currentFile}"?`)) return;
      await fetch(`/api/content?file=${encodeURIComponent(currentFile)}`, { method: 'DELETE' });
      await loadFileList('doc.md');
    };

    // --- Imágenes Locales ---
    const imgSelect = document.getElementById('img-select');
    async function refreshImageList(selected = '') {
      const imgs = await fetch('/api/images').then(r => r.json());
      imgSelect.innerHTML = '<option value="">-- Seleccionar imagen --</option>' +
        imgs.map(i => `<option value="/images/${i}">${i}</option>`).join('');
      if (selected) imgSelect.value = `/images/${selected}`;
    }
    await refreshImageList();

    const fileUploadImg = document.getElementById('file-upload-img');
    document.getElementById('btn-upload-img').onclick = () => fileUploadImg.click();
    fileUploadImg.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = async () => {
        const res = await fetch(`/api/images?name=${encodeURIComponent(file.name)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: reader.result
        });
        if (res.ok) {
          await refreshImageList(file.name);
          const nameNoExt = file.name.replace(/\.[^.]+$/, '');
          cm.replaceSelection(`![${nameNoExt}](/images/${file.name})`);
          cm.focus();
        }
        fileUploadImg.value = '';
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('btn-insert-img').onclick = () => {
      const val = imgSelect.value;
      if (!val) return;
      const name = val.split('/').pop().replace(/\.[^.]+$/, '');
      cm.replaceSelection(`![${name}](${val})`);
      cm.focus();
      closeMobileDrawers();
    };

    // --- Control de Sidebars (Escritorio vs Móvil) ---
    const workspace = document.getElementById('app-workspace');
    const leftDrawer = document.getElementById('left-sidebar');
    const rightDrawer = document.getElementById('right-sidebar');
    const backdrop = document.getElementById('drawer-backdrop');

    function closeMobileDrawers() {
      leftDrawer.classList.remove('open');
      rightDrawer.classList.remove('open');
      backdrop.classList.remove('visible');
    }
    backdrop.onclick = closeMobileDrawers;

    function toggleLeftSidebar() {
      if (window.innerWidth <= 768) {
        rightDrawer.classList.remove('open');
        const isOpen = leftDrawer.classList.toggle('open');
        backdrop.classList.toggle('visible', isOpen);
      } else {
        workspace.classList.toggle('hide-left');
        setTimeout(() => { if (!isKnitView) mm.fit(); }, 220);
      }
    }

    function toggleRightSidebar() {
      if (window.innerWidth <= 768) {
        leftDrawer.classList.remove('open');
        const isOpen = rightDrawer.classList.toggle('open');
        backdrop.classList.toggle('visible', isOpen);
      } else {
        workspace.classList.toggle('hide-right');
        setTimeout(() => { if (!isKnitView) mm.fit(); }, 220);
      }
    }

    document.getElementById('btn-left-drawer').onclick = toggleLeftSidebar;
    document.getElementById('nav-files').onclick = toggleLeftSidebar;
    document.getElementById('btn-right-drawer').onclick = toggleRightSidebar;
    document.getElementById('nav-meta').onclick = toggleRightSidebar;

    // Alternar Vista en Móvil (Editor <-> Visor) y en Escritorio
    const centerStage = document.getElementById('center-stage');
    const btnSwitchMobile = document.getElementById('btn-switch-mobile');
    function switchMobileView() {
      const current = centerStage.dataset.mobileView;
      const next = current === 'editor' ? 'viewer' : 'editor';
      centerStage.dataset.mobileView = next;
      btnSwitchMobile.textContent = next === 'editor' ? '🗺️ Ver Salida' : '✏️ Editar MD';
      if (next === 'viewer') setTimeout(() => { if (!isKnitView) mm.fit(); else updateKnitPreview(); }, 60);
      else setTimeout(() => cm.refresh(), 60);
    }
    btnSwitchMobile.onclick = switchMobileView;

    document.getElementById('btn-toggle-editor-desktop').onclick = function() {
      const ed = document.getElementById('editor-container');
      ed.classList.toggle('hidden');
      this.classList.toggle('active', !ed.classList.contains('hidden'));
      setTimeout(() => { if (!isKnitView) mm.fit(); }, 50);
    };

    document.getElementById('btn-theme').onclick = () => {
      document.body.classList.toggle('theme-light');
    };

    // --- Opciones de Markmap ---
    const fitAction = () => { mm.fit(); closeMobileDrawers(); };
    document.getElementById('btn-fit').onclick = fitAction;
    document.getElementById('btn-fit-side').onclick = fitAction;

    document.getElementById('btn-autofit').onclick = function() {
      state.autoFit = !state.autoFit;
      this.classList.toggle('active', state.autoFit);
    };

    function toggleSolidColor() {
      state.colorFreezeLevel = state.colorFreezeLevel ? 0 : 2;
      document.getElementById('btn-solid-color').classList.toggle('active', state.colorFreezeLevel > 0);
      document.getElementById('btn-solid-side').classList.toggle('active', state.colorFreezeLevel > 0);
      render(false);
    }
    document.getElementById('btn-solid-color').onclick = toggleSolidColor;
    document.getElementById('btn-solid-side').onclick = toggleSolidColor;

    function promptWrapText() {
      const current = state.maxWidth > 0 ? state.maxWidth : '';
      const input = prompt('Ancho máximo de nodo en píxeles (ej. 250, o vacío para desactivar):', current);
      if (input === null) return;
      const n = parseInt(input, 10);
      state.maxWidth = (isNaN(n) || n <= 0) ? 0 : n;
      const label = state.maxWidth > 0 ? `Ancho: ${state.maxWidth}px` : 'Ajustar texto';
      document.getElementById('btn-wrap-text').classList.toggle('active', state.maxWidth > 0);
      document.getElementById('btn-wrap-side').classList.toggle('active', state.maxWidth > 0);
      document.getElementById('btn-wrap-text').textContent = label;
      render(true);
    }
    document.getElementById('btn-wrap-text').onclick = promptWrapText;
    document.getElementById('btn-wrap-side').onclick = promptWrapText;

    document.getElementById('btn-expand-level').onclick = function() {
      const current = state.expandLevel > 0 ? state.expandLevel : '';
      const input = prompt('Nivel máximo desplegado (vacío para todos):', current);
      if (input === null) return;
      const n = parseInt(input, 10);
      state.expandLevel = isNaN(n) ? -1 : n;
      this.classList.toggle('active', state.expandLevel > 0);
      this.textContent = state.expandLevel > 0 ? `Nivel máx: ${state.expandLevel}` : 'Nivel máx. desplegado';
      render(true);
    };

    document.getElementById('btn-line-width').onclick = function() {
      const ed = document.getElementById('editor-container');
      ed.classList.toggle('readable-line-length');
      this.classList.toggle('active', ed.classList.contains('readable-line-length'));
    };

    document.getElementById('btn-open-url').onclick = async () => {
      const url = prompt('Introduce la URL del archivo Markdown:');
      if (url) cm.setValue(await fetch(url).then(r => r.text()));
    };

    // --- Barra Inferior Conmutable y Botón Sutil ---
    const bottomNav = document.getElementById('bottom-nav');
    const btnToggleBottom = document.getElementById('btn-toggle-bottom-bar');
    btnToggleBottom.onclick = () => {
      const isVis = bottomNav.classList.toggle('visible');
      btnToggleBottom.classList.toggle('bar-open', isVis);
      btnToggleBottom.textContent = isVis ? '⌄ Ocultar' : '⌃ Barra';
    };

    // Deshacer / Rehacer en el editor (o navegar historial de notas si no hay cambios que deshacer)
    document.getElementById('nav-undo').onclick = () => {
      if (cm.historySize().undo > 0) {
        cm.undo();
        cm.focus();
      } else if (navIndex > 0) {
        navIndex--;
        loadDocument(navHistory[navIndex], false);
        renderSidebar();
      }
    };
    document.getElementById('nav-redo').onclick = () => {
      if (cm.historySize().redo > 0) {
        cm.redo();
        cm.focus();
      } else if (navIndex < navHistory.length - 1) {
        navIndex++;
        loadDocument(navHistory[navIndex], false);
        renderSidebar();
      }
    };

    // --- Paleta de Comandos (Pull-Down Action) ---
    const cmdBackdrop = document.getElementById('command-palette-backdrop');
    const cmdInput = document.getElementById('cmd-input');
    const cmdResults = document.getElementById('cmd-results');

    const commands = [
      { name: '📄/🗺️ Alternar Salida: Mapa Mental / Documento Knit', action: () => toggleViewMode() },
      { name: '📱 Alternar Editor / Visor (Móvil)', action: () => switchMobileView() },
      { name: '⊡ Encajar Mapa en Pantalla', action: () => mm.fit() },
      { name: '🎨 Alternar Color Sólido por Rama', action: () => toggleSolidColor() },
      { name: '📏 Configurar Ancho de Texto en Nodos', action: () => promptWrapText() },
      { name: '🌓 Cambiar Tema Oscuro / Claro', action: () => document.body.classList.toggle('theme-light') },
      { name: '➕ Crear Nueva Nota Markdown', action: () => document.getElementById('btn-new-file').click() },
      { name: '✏️ Renombrar Nota Actual', action: () => document.getElementById('btn-rename-file').click() },
      { name: '⬇️ Exportar Documento HTML Estilo RStudio Knit (con TOC)', action: () => document.getElementById('export-knit').click() },
      { name: '⬇️ Exportar Documento a PDF Estilo LaTeX', action: () => document.getElementById('export-pdf').click() },
      { name: '⬇️ Exportar Mapa Interactivo a HTML', action: () => document.getElementById('export-html').click() },
      { name: '⬇️ Exportar Mapa a SVG', action: () => document.getElementById('export-svg').click() }
    ];

    function openCommandPalette() {
      cmdBackdrop.classList.remove('hidden');
      cmdInput.value = '';
      renderCommandList('');
      setTimeout(() => cmdInput.focus(), 50);
    }
    function closeCommandPalette() {
      cmdBackdrop.classList.add('hidden');
    }
    cmdBackdrop.onclick = (e) => { if (e.target === cmdBackdrop) closeCommandPalette(); };
    document.getElementById('btn-cmd-top').onclick = openCommandPalette;
    document.getElementById('nav-cmd').onclick = openCommandPalette;

    function renderCommandList(query) {
      const q = query.toLowerCase();
      const matchedCmds = commands.filter(c => c.name.toLowerCase().includes(q));
      const matchedFiles = allFiles.filter(f => f.path.toLowerCase().includes(q));

      let html = '';
      matchedCmds.forEach((c, idx) => {
        html += `<div class="cmd-item" data-type="cmd" data-idx="${idx}"><span>${c.name}</span><small>Comando</small></div>`;
      });
      matchedFiles.forEach(f => {
        html += `<div class="cmd-item" data-type="file" data-path="${f.path}"><span>📄 ${f.path}</span><small>Abrir nota</small></div>`;
      });
      cmdResults.innerHTML = html || '<div style="padding:12px;color:var(--text-muted)">Sin resultados</div>';

      cmdResults.querySelectorAll('.cmd-item').forEach(el => {
        el.onclick = () => {
          closeCommandPalette();
          if (el.dataset.type === 'cmd') matchedCmds[el.dataset.idx].action();
          else loadDocument(el.dataset.path, true);
        };
      });
    }
    cmdInput.oninput = () => renderCommandList(cmdInput.value);

    // --- Gestos Táctiles Móviles (Swipe Lateral y Pull-Down) ---
    let touchStartX = 0, touchStartY = 0;
    const pullIndicator = document.getElementById('pull-indicator');

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (window.innerWidth > 768) return;
      const dy = e.touches[0].clientY - touchStartY;
      if (touchStartY < 70 && dy > 50) pullIndicator.classList.add('visible');
      else pullIndicator.classList.remove('visible');
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      pullIndicator.classList.remove('visible');
      if (window.innerWidth > 768) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const isViewer = centerStage.dataset.mobileView === 'viewer';

      if (Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 1.8) {
        if (dx > 0 && (touchStartX < 45 || !isViewer) && !rightDrawer.classList.contains('open')) {
          leftDrawer.classList.add('open');
          backdrop.classList.add('visible');
        } else if (dx < 0 && (touchStartX > window.innerWidth - 45 || !isViewer) && !leftDrawer.classList.contains('open')) {
          rightDrawer.classList.add('open');
          backdrop.classList.add('visible');
        } else {
          closeMobileDrawers();
        }
      }
      if (dy > 95 && Math.abs(dy) > Math.abs(dx) * 2 && touchStartY < 75) {
        openCommandPalette();
      }

        const tpl = btn.dataset.insert.replace(/\\n/g, '\n');
        const doc = cm.getDoc();
        const sel = doc.getSelection();
        if (tpl.includes('|')) {
          const [prefix, suffix] = tpl.split('|');
          const cursor = doc.getCursor();
          doc.replaceSelection(`${prefix}${sel}${suffix}`);
          if (!sel) doc.setCursor({ line: cursor.line, ch: cursor.ch + prefix.length });
        } else {
          doc.replaceSelection(`${tpl}${sel}`);
        }
        cm.focus();
      };
    });

        const newW = ((ev.clientX - rect.left) / rect.width) * 100;
        if (newW > 15 && newW < 85) editorContainer.style.width = `${newW}%`;

      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
